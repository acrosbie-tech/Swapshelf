services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_PATH: /app/data/swapshelf.db
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in a .env file}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    volumes:
      - swapshelf-data:/app/data
    restart: unless-stopped
volumes:
  swapshelf-data:
